---

# Remove FITS

- name: "Check if the fits-nailgun service is enabled"
  command: "systemctl is-enabled fits-nailgun"
  register: "service_status"
  failed_when: "service_status.rc not in [0, 1]"
  changed_when: false
  check_mode: false # it's a safe read only operation, otherwise following tasks will fail


- name: "Stop and disable fits-nailgun service"
  service:
    name: "fits-nailgun"
    state: "stopped"
    enabled: false
  when: service_status.rc == 0

- name: "Reset failed state for fits-nailgun service"
  command: "systemctl reset-failed fits-nailgun"
  when: service_status.rc == 0

- name: "Uninstall FITS and its dependencies"
  package:
    name:
      - "fits"
      - "nailgun"
    state: "absent"
